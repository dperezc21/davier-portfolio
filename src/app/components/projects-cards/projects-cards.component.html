<div class="projects">
  @for (project of projects; track project.projectName) {
    <div class="project-card">
      <p class="project-title">{{project.projectName}}</p>
      <div class="icons">
        @for(icon of project.technologiesIcons; track icon.name) {
          <img class="icon" src="{{icon.path}}" alt="{{icon.name}}">
        }
      </div>
      <div class="display-flex-row">
        <a
          *ngIf="project.repository"
          class="project-btn repo-btn"
          target="_blank"
          [href]="project.repository"
        >
          Repository
        </a>

        <a
          *ngIf="project.link"
          class="project-btn page-btn"
          target="_blank"
          [href]="project.link"
        >
          Live Demo
        </a>
      </div>
    </div>
  }
</div>
